<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web template with p5.js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>

<body>
    <div class="menu-wrapper">
        <div class="burger-icon">≡</div>
        <div class="sidebar">
        </div>
    </div>
    <main>

        <div class="page" id="page1" title="side1">
            <div id="player">
                <div class="cards"></div>
                <span class="buttons">
                    <button id="playerDrawBnt">draw card</button>
                    <button id="playerStandBtn">stand</button>
                </span>
                <div class="total"> player total</div>

            </div>
            <div id="dealer">
                <div class="cards">delers cards</div>
                <div class="total"> dealer total</div>

            </div>
            <div id="result"></div>
          
          
        </div>

        <div class="page" id="page2" title="side2">
            <span>
                <h1>you lost</h1>
                <button id="restartBtnLose">Restart</button>    
                
            </span>     
        </div>

        <div class="page" id="page3" title="side 3">
            <span>
                <h1>you win</h1>
                <button id="restartBtnWin"> play again</button>
            </span>
        </div>

    </main>
    <script src="./index.js"></script>
</body>

</html>
